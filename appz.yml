app:
  name: apache
  code: apache
  notify: appzdev@cloudbourne.co

build:
  version: 1.0
  env: PROD
  repo: https://github.com/TI-Pro/TIWebsite
  args:
    WORK_DIR: "/appz/server/source/apache"
  build_file: none
  output_files: output/*.zip
  image_template: phphttpd-2.4

deploy:
  context: tipreprod/PROD
  #ingress: none
  replicas: 1
  #resources: x-large
  port:
  - 9369

volumes:
  - claim: lamp-pvc
    mount: /appz/data
    name: lamp-pvc
    size: 64Gi
    matchLabels: false

nodeSelector:
  nodepool: apache

tolerations:
  - key: "nodepool"
    operator: "Equal"
    value: "apache"
    effect: "NoSchedule"

properties:
  MYSQL_HOST : "mysql-slave-8-1:3306"
  MYSQL_DATABASE : ""
  MYSQL_USER : "web_client"
  ENABLE_HA : "no"
  DB_PASSWORD:
     vault: DB_PASSWORD
     
  ACTIVECAMPAIGN_URL:
    vault: ACTIVECAMPAIGN_URL
  ACTIVECAMPAIGN_API_KEY:
    vault: ACTIVECAMPAIGN_API_KEY

  revision : 2
