app:
  name: tiq_marketexplorer
  code: tiq_marketexplorer
  notify: appzdev@cloudbourne.co

build:
  version: 1.0
  env: PROD
  repo: https://github.com/TI-Pro/TIWebsite
  args:
    WORK_DIR: "/appz/server/source/apache"
  build_file: none
  output_files: output/*.zip
  image_template: apache-2.4

deploy:
  context: tipreprod/PROD
  #ingress: none
  replicas: 1
  #resources: x-large
  port:
  - 9369

nodeSelector:
  nodepool: apache

tolerations:
  - key: "nodepool"
    operator: "Equal"
    value: "apache"
    effect: "NoSchedule"

properties:
  MYSQL_HOST : "172.20.22.64:3306"
  MYSQL_DATABASE : ""
  MYSQL_USER : ""
  ENABLE_HA : "no"
  DB_PASSWORD:
     vault: DB_PASSWORD

  revision : 2
